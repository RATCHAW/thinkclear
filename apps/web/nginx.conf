server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The same headers vercel.json sets in production. Keeping them here means
    # the compose stack is not a laxer environment than the deployed one.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The MCP endpoint and /api/events both answer over SSE; buffering
        # would hold a streamed tool result until the exchange finished, and
        # the long read timeout is what lets the events stream sit open.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # OAuth discovery lives at the origin root by RFC 9728 / RFC 8414, which
    # is where an MCP client looks for it. The API serves the documents.
    location /.well-known/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite writes a content hash into every filename here, so a stale copy is
    # unreachable by construction. `expires` rather than `add_header`: a second
    # `add_header` in a location replaces every inherited one, which would drop
    # the four security headers above from exactly the files most of the app is.
    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
