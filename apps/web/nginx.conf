server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The MCP endpoint answers over SSE; buffering it would hold a
        # streamed tool result until the exchange finished.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # OAuth discovery lives at the origin root by RFC 9728 / RFC 8414, which
    # is where an MCP client looks for it. The API serves the documents.
    location /.well-known/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
