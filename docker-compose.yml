name: mindmap

services:
  mongo:
    image: mongo:8
    container_name: mindmap-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mindmap-api
    profiles: ["full"]
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/mindmap
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me}
      BETTER_AUTH_URL: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:5173
      PORT: "3000"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mindmap-web
    profiles: ["full"]
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo-data:
